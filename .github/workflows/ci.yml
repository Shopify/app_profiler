name: CI

on: [push]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / Rack ${{ matrix.rack }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      RACK_VERSION: ${{ matrix.rack }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["7.2", "8.0", "8.1"]
        rack: ["2.2", "3.0", "3.1", "3.2"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler: "4.0.22"
    - name: Test
      run: |
        bundle update --all --jobs 4 --retry 3
        bundle exec rake
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby 3.3
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: "3.3"
        bundler: "4.0.22"
    - name: Build
      run: |
        bundle install --jobs 4 --retry 3
    - name: Lint
      run: |
        bundle exec rubocop
